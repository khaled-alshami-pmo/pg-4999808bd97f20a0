#status{font-size:13px}.hint{font-size:13px;text-align:center;margin:0 0 8px}@media(max-width:520px){.cols{grid-template-columns:1fr}.card{padding:18px}.bar{gap:5px;padding:6px}.bar button{font-size:14px;padding:6px}h1{font-size:27px}nav{grid-template-columns:1fr 1fr}nav div{display:flex;gap:12px;align-items:center}nav b{margin:0}.lead{font-size:21px}}a{color:#655080;text-decoration:underline;text-underline-offset:4px}a:hover{color:#362847}a:focus-visible{outline:3px solid #8874a3}</style><div id="carousel"><div class="bar"><button id="prev">→ السابقة</button><span id="count" dir="ltr"></span><button id="next">التالية ←</button><button id="pause">إيقاف</button><button id="open">تكبير ⛶</button></div><article class="card" id="panel" tabindex="0" role="button" aria-label="تكبير اللوحة"></article><div class="dots" id="dots"></div><p class="hint" id="status"></p><footer>مكارم الأخلاق · المكتب يجهز القوالب ويربطها · المراجع: مكتب المشاريع · المعتمد: مدير المشروع · التعاقد والصرف وفق صلاحياتهما</footer></div><dialog id="zoom"><div class="bar"><button id="close">إغلاق ×</button><button id="zprev">→ السابقة</button><span id="zcount" dir="ltr"></span><button id="znext">التالية ←</button></div><article class="card" id="large"></article></dialog><script>const slides=["<span class=\"eyebrow\">دليل مدير المشروع</span><h1>رحلة المشروع والنماذج</h1><p class=\"lead\">مكتب المشاريع يجهز الحزمة والنماذج.<br>أنت تحدّث الحالة وتسلّم الشاهد وتعتمد المخرجات.<br>مكتب المشاريع يراجع، ومدير المشروع يعتمد.</p><nav><div><b>١</b>التأسيس</div><div><b>٢</b>التخطيط</div><div><b>٣</b>التنفيذ</div><div><b>٤</b>المراقبة والتحكم</div><div><b>٥</b>إنهاء المشروع</div></nav>", "<span class=\"eyebrow\">المحطة ١ من ٥</span><h1>التأسيس</h1><div class=\"form\"><small>النموذج الذي تستخدمه</small><h2><a href=\"https://files.instinct.com/8xaafw00i390\" target=\"_blank\" rel=\"noopener noreferrer\">ملف الفكرة والتسويق</a>، للاسترشاد فقط</h2></div><div class=\"cols\"><section><small>المطلوب منك</small><p>استلم الفكرة المرشحة وسياقها، ووضح المستهدفين والأثر والمخرج المطلوب. استخدم المثال الاسترشادي لبناء ملف فكرتك، واستبدل محتواه بمعلومات المشروع وشواهده.</p></section><section><small>كيف تتم المتابعة</small><p>مكتب المشاريع يقود ورش الأفكار وترشيح المشاريع وتسويقها للدعم. مخرجات المخطط: قاعدة أفكار وملفات تسويقية. الموافقة الأولية السابقة لتكليف المدير تبقى باسم مكتب المشاريع.</p></section></div>", "<span class=\"eyebrow\">المحطة ٢ من ٥</span><h1>التخطيط</h1><div class=\"form\"><small>النموذج الذي تستخدمه</small><h2>ملف تخطيط موحد مقترح: <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=152112359#gid=152112359\" target=\"_blank\" rel=\"noopener noreferrer\">بطاقة المشروع</a> + <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=697218519#gid=697218519\" target=\"_blank\" rel=\"noopener noreferrer\">وثيقة المشروع</a> + <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=57105231#gid=57105231\" target=\"_blank\" rel=\"noopener noreferrer\">العرض الفني</a></h2></div><div class=\"cols\"><section><small>المطلوب منك</small><p>راجع البطاقة، وأكمل الوثيقة وأهدافها ونطاقها ومؤشراتها، ثم <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=57105231#gid=57105231\" target=\"_blank\" rel=\"noopener noreferrer\">العرض الفني</a> لشركاء التنفيذ. أدرج الخطط التشغيلية والمالية وأصحاب المصلحة كملاحق داخل الملف، لا نماذج مستقلة إضافية.</p></section><section><small>كيف تتم المتابعة</small><p>يراجع المكتب اتساق الميزانية والمخرجات والجدول. <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=697218519#gid=697218519\" target=\"_blank\" rel=\"noopener noreferrer\">وثيقة المشروع</a> هنا قبل العقد، كما في مخطط مكارم المصمم. يعتمد مدير المشروع ملف التخطيط بعد مراجعة مكتب المشاريع وقبل رفعه للترسية وفق الصلاحيات.</p></section></div>", "<span class=\"eyebrow\">المحطة ٣ من ٥</span><h1>التنفيذ</h1><div class=\"form\"><small>النموذج الذي تستخدمه</small><h2>ملف التعاقد: <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=1571319998#gid=1571319998\" target=\"_blank\" rel=\"noopener noreferrer\">بطاقة العقد</a> + تقييم العروض + العقد الموقع</h2></div><div class=\"cols\"><section><small>المطلوب منك</small><p>استلم عروض المنفذين، وسجل رأيك الفني والمالي، واستكمل <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=1571319998#gid=1571319998\" target=\"_blank\" rel=\"noopener noreferrer\">بطاقة العقد</a>. تحقق من التسليم والدفعات والملكية والتصاريح والتقارير وشرط عدم المواصلة قبل التوقيع.</p></section><section><small>كيف تتم المتابعة</small><p>يراجع مكتب المشاريع توصية الاختيار والبطاقة، ويعتمد مدير المشروع المخرج الفني للمتابعة. يرفع العقد للتوقيع وفق صلاحياته الأصلية. منذ التعاقد يسجل شرط الإشعار وتاريخه. التوقيع والصرف ليسا صلاحية يمنحها هذا الدليل.</p></section></div>", "<span class=\"eyebrow\">المحطة ٤ من ٥</span><h1>المراقبة والتحكم</h1><div class=\"form\"><small>النموذج الذي تستخدمه</small><h2>سجل متابعة موحد مقترح: خطة المنفذ + <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=814576949#gid=814576949\" target=\"_blank\" rel=\"noopener noreferrer\">التقرير الدوري</a> + <a href=\"https://docs.google.com/spreadsheets/d/1X_Q0wSaMJcwGqSrtl2qjav8ONMKK2V_u/edit?gid=1825210792#gid=1825210792\" target=\"_blank\" rel=\"noopener noreferrer\">بطاقة صرف الدفعات المالية</a> + التواصل + الإشهار + طلب التغيير</h2></div><div class=\"cols\"><section><small>المطلوب منك</small><p>حدّث الإنجازات والتحديات والشواهد والدفعات المستحقة. جهز التقرير الأسبوعي أو الشهري أو الدوري عند طلبه. سجل طلب التغيير وأثره قبل تعديل الخطة، ووثق التواصل والنشر.</p></section><section><small>كيف تتم المتابعة</small><p>يراجع المكتب خطة التنفيذ وجودة المخرجات ومواعيد الاجتماعات. يحدد تكرار التقرير حسب المشروع والعقد، لا تفرض كل الأنواع معاً. المحاسب يراجع الصرف، ويعتمد مدير المشروع مخرجات المتابعة والتغيير بعد مراجعة مكتب المشاريع، ضمن النطاق والميزانية والصلاحيات المعتمدة. نموذجا التواصل مع الشريك التنفيذي والنشر الإلكتروني: مطلوب توفيرهما.</p></section></div>", "<span class=\"eyebrow\">المحطة ٥ من ٥</span><h1>إنهاء المشروع</h1><div class=\"form\"><small>النموذج الذي تستخدمه</small><h2>حزمة ختامية واحدة مقترحة: التقرير النهائي + محضر التسليم والإغلاق + صندوق الجهة المانحة</h2></div><div class=\"cols\"><section><small>المطلوب منك</small><p>جهز التقرير وتصميمه والدروس والتوصيات، وسلّم المنتجات الورقية والإلكترونية والملفات المصدرية وصندوق الداعم. أكمل الالتزامات والملاحظات وإثبات تسليم التقرير.</p></section><section><small>كيف تتم المتابعة</small><p>يراجع مكتب المشاريع المخرجات والشواهد، ويعتمد مدير المشروع التسليم والإغلاق بعد استيفاء الالتزامات، دون إسقاط اعتماد تعاقدي أو مالي مطلوب. عدم المواصلة يتبع العقد، وقد تسبق مهلة إشعاره هذه المرحلة. التنبيه التلقائي مطلوب لكنه غير مفعل حتى توثيق المهلة وتاريخها وفترة التنبيه والمستلم.</p></section></div>"];let index=0,hover=false,paused=false,timer;const $=id=>document.getElementById(id);function render(){$('panel').innerHTML=slides[index];$('large').innerHTML=slides[index];$('count').textContent=$('zcount').textContent=(index+1)+' / '+slides.length;document.querySelectorAll('#dots button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));$('pause').textContent=paused?'استئناف':'إيقاف';$('status').textContent=hover||paused||$('zoom').open?'التناوب متوقف':'تتناوب المحطات كل ٤ ثوانٍ · مرّر الماوس للتوقف'}function reset(){clearInterval(timer);if(!hover&&!paused&&!$('zoom').open)timer=setInterval(()=>step(1),4000);render()}function step(d){index=(index+d+slides.length)%slides.length;render()}for(let i=0;i<slides.length;i++){let b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{index=i;render()};$('dots').append(b)}$('prev').onclick=$('zprev').onclick=()=>step(-1);$('next').onclick=$('znext').onclick=()=>step(1);$('pause').onclick=()=>{paused=!paused;reset()};$('carousel').onmouseenter=()=>{hover=true;reset()};$('carousel').onmouseleave=()=>{hover=false;reset()};function openZoom(){$('zoom').showModal();reset()}$('panel').onclick=e=>{if(!e.target.closest('a'))openZoom()};$('open').onclick=openZoom;$('panel').onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('a'))openZoom()};$('close').onclick=()=>$('zoom').close();$('zoom').onclose=reset;document.onkeydown=e=>{if(e.key==='ArrowLeft')step(1);if(e.key==='ArrowRight')step(-1)};reset();</script></html>
